[General]
# Ten quang ba ra dien thoai. Mac dinh cua daemon la "BlueZ 5.55" — nguoi
# quet thay mot cai ten thu vien chu khong phai thiet bi.
Name = HUD-RZV2L

# 0x000100 = may tinh, chua phan loai. KHONG de 0x000000: nhieu dien thoai
# LOC BO thiet bi class 0 khoi danh sach quet — bo hien dien tren song ma
# man hinh van trong (dinh that 25/08/2026).
Class = 0x000100

# 0 = khong bao gio het han. Mac dinh 180 giay — bo tu an sau 3 phut ke tu
# boot, va nguoi cam dien thoai quet sau do khong bao gio thay no.
DiscoverableTimeout = 0
PairableTimeout = 0

[Policy]
# Tu bat adapter ngay khi dongle xuat hien, khoi cho "power on" bang tay.
AutoEnable = true
