# chan-demo.cfg — BANG TIN HIEU CHAN, va no la mot LOP AN TOAN chu khong phai
# mot cho giu cho.
#
# Khong co --signals thi hud_app dung bang bien dich san (SIGDB_HUD_DEMO) —
# bang viet cho can_sim.py, giai ma ID 0x100..0x105. Tren mot chiec xe that,
# nhung ID do la khung quang ba binh thuong cua hang, va bang demo bien chung
# thanh: speed = 179,2 km/h voi vs_is_usable = 1, so "D", bien bao 123 km/h.
# So SAI trong nhu so THAT — dung kieu hong nguy hiem nhat cua ca du an.
#
# 10 truong: can_id start_bit bit_len le|be u|s scale offset min max ten
# ID 0x1FFFFFFF khong xe nao dung -> bang HOP LE nhung khong bao gio khop.
# Tep RONG bi tu choi va hud_app quay ve bang demo, nen phai co dung mot dong.
0x1FFFFFFF 0 8 le u 1 0 0 1 speed
