# onekiwi-bt-wifi.cfg — Bluetooth + WiFi cho RZ/V2L.
#
# DUNG =y CHU KHONG =m cho lop loi. Bo khong co initramfs nap module som, va
# ngan xep built-in thi khong bao gio lech vermagic khi ai do build lai nhan.
#
# DO TRUOC KHI VIET (bo, 25/08/2026):
#   zcat /proc/config.gz | grep CONFIG_BT   ->  "# CONFIG_BT is not set"
#   lsusb  ->  Bus 003 Device 002: ID 0a12:0001 Cambridge Silicon Radio
# Dongle duoc USB core liet ke nhung KHONG driver nao nhan, dmesg khong mot
# dong. Tuc thieu han ngan xep chu khong phai thieu module.

# =========================================================================
# BLUETOOTH — muc tieu la SPP (Serial Port Profile) cho navlink
# =========================================================================
CONFIG_BT=y
CONFIG_BT_BREDR=y            # Classic BR/EDR. BAT BUOC: BLE KHONG co SPP.
CONFIG_BT_RFCOMM=y           # SPP chay tren RFCOMM
CONFIG_BT_RFCOMM_TTY=y       # phoi ra /dev/rfcommN — go loi bang cat/echo duoc
CONFIG_BT_HS=y
CONFIG_BT_LE=y               # khong dung SPP nhung bluetoothd keu neu thieu

# Driver cho dongle dang cam: 0a12:0001 Cambridge Silicon Radio (CSR)
CONFIG_BT_HCIBTUSB=y
CONFIG_BT_HCIBTUSB_BCM=y
CONFIG_BT_HCIBTUSB_AUTOSUSPEND=y
# CSR doi cu KHONG can firmware ngoai -> khong phai keo linux-firmware vao.

# Duong UART, phong khi sau nay dung module HC-05/HC-06 gan thang vao ttySC
CONFIG_BT_HCIUART=y
CONFIG_BT_HCIUART_H4=y

# Nen tang crypto ma BT phu thuoc. THIEU LA CONFIG_BT BI TAT AM THAM luc
# oldconfig — kieu hong rat ton thoi gian vi khong co thong bao nao.
CONFIG_CRYPTO_ECDH=y
CONFIG_CRYPTO_CMAC=y
CONFIG_CRYPTO_USER_API_HASH=y

# =========================================================================
# WIFI — chua biet dongle nao, nen bat CA HAI ho pho bien nhat
# =========================================================================
CONFIG_WIRELESS=y
CONFIG_CFG80211=y
CONFIG_CFG80211_WEXT=y       # vai cong cu cu (kem wpa_supplicant) van hoi qua day
CONFIG_MAC80211=y
CONFIG_MAC80211_RC_MINSTREL=y
CONFIG_WLAN=y
CONFIG_WLAN_VENDOR_REALTEK=y
CONFIG_WLAN_VENDOR_RALINK=y
CONFIG_WLAN_VENDOR_MEDIATEK=y
CONFIG_WLAN_VENDOR_ATH=y

# Realtek USB — ho pho bien nhat o VN (RTL8188EU/8192CU/8723...)
CONFIG_RTL8XXXU=y
CONFIG_RTL8XXXU_UNTESTED=y
CONFIG_RTL8187=y
CONFIG_RTL_CARDS=y
CONFIG_RTL8192CU=y

# Ralink/MediaTek USB
CONFIG_RT2X00=y
CONFIG_RT2800USB=y
CONFIG_RT2800USB_RT33XX=y
CONFIG_RT2800USB_RT35XX=y
CONFIG_RT2800USB_RT3573=y
CONFIG_RT2800USB_RT53XX=y
CONFIG_RT2800USB_RT55XX=y
CONFIG_RT2800USB_UNKNOWN=y
CONFIG_MT7601U=y

# Atheros USB
CONFIG_ATH9K_HTC=y

# WiFi CAN firmware ngoai (khac Bluetooth CSR) — xem local.conf, phai them
# linux-firmware vao IMAGE_INSTALL, khong thi driver nap xong ma khong ket noi.
