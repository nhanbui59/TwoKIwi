# Kernel cmdline - DEV/DEBUG mode (set ONEKIWI_DEBUG_LOG = "1" in local.conf)
# - loglevel=7: full kernel messages on the serial UART (ttySC0)
# - fbcon=disable kept: screen NEVER shows kernel text, even in dev mode
CONFIG_CMDLINE_BOOL=y
CONFIG_CMDLINE="rw rootwait earlycon root=/dev/mmcblk1p2 wdt_overflow=0 console=ttySC0,115200 loglevel=7 fbcon=disable vt.global_cursor_default=0"
CONFIG_CMDLINE_FORCE=y
