# Kernel cmdline - RELEASE mode (default)
# - quiet loglevel=3: minimal kernel messages (errors only)
# - fbcon=disable: no text console on framebuffer (screen stays clean)
# - console=ttySC0: debug output still available on the serial UART cable
CONFIG_CMDLINE_BOOL=y
CONFIG_CMDLINE="rw rootwait earlycon root=/dev/mmcblk1p2 wdt_overflow=0 console=ttySC0,115200 quiet loglevel=3 fbcon=disable vt.global_cursor_default=0"
CONFIG_CMDLINE_FORCE=y
