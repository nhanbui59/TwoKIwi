# Kernel config fragment — man hinh RZ/V2L + Newhaven NHD-3.5-640480EF
# Trich tu /proc/config.gz cua image DA CHAY DUOC.
CONFIG_DRM_RZG2L_DU=y
CONFIG_DRM_RZG2L_MIPI_DSI=y
CONFIG_DRM_MIPI_DSI=y
CONFIG_DRM_PANEL=y
CONFIG_DRM_PANEL_BRIDGE=y
CONFIG_DRM_PANEL_SITRONIX_ST7703=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FB=y
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_BACKLIGHT_PWM=y

# CAN bus (classic + FD)
CONFIG_CAN=y
CONFIG_CAN_DEV=y
CONFIG_CAN_VCAN=y
CONFIG_CAN_RAW=y
CONFIG_CAN_BCM=y
CONFIG_CAN_GW=y
CONFIG_CAN_ISOTP=y
CONFIG_CAN_J1939=y
CONFIG_CAN_SLCAN=y
CONFIG_CAN_RCAR_CANFD=y

# USB Host (cdc_acm, storage, serial, hid)
CONFIG_USB_ACM=y
CONFIG_USB_SERIAL=y
CONFIG_USB_STORAGE=y
CONFIG_USB_USBNET=y
CONFIG_USB_HID=y
CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_INPUT_EVDEV=y
CONFIG_TOUCHSCREEN_USB_COMPOSITE=y

# ===== Mali-G31 GPU (Panfrost open driver, Bifrost) =====
# Panfrost is the FOSS DRM driver for ARM Mali Bifrost GPUs (the RZ/V2L SoC has
# a Mali-G31). It registers as /dev/dri/card0 and exports a render node.
# PM_DEVFREQ is needed by the panfrost devfreq-based clock scaling.
CONFIG_DRM_PANFROST=y
CONFIG_PM_DEVFREQ=y

# ===== Kernel boot logo (custom OneKiWi logo) =====
# The kernel build turns drivers/video/logo/logo_linux_clut224.ppm into the
# boot logo via the scripts/pnmtologo host tool. The PPM is replaced by our
# logo through the linux-renesas_5.10.bbappend.
CONFIG_LOGO=y
CONFIG_LOGO_LINUX_CLUT224=y
# (kernel cmdline moved to onekiwi-cmdline-quiet.cfg / onekiwi-cmdline-debug.cfg,
#  selected by ONEKIWI_DEBUG_LOG in local.conf - default is quiet/release)
